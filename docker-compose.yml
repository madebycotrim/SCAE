services:
  # 🌐 Frontend (Vite)
  web:
    image: node:22
    container_name: scae-web
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_PROXY_TARGET=http://api:8788
    command: sh -c "npm install && npx vite --host 0.0.0.0"

  # ⚙️ Backend (Wrangler/Cloudflare Pages)
  api:
    image: node:22
    container_name: scae-api
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8788:8788"
    command: sh -c "npm install && npx wrangler pages dev . --ip 0.0.0.0 --port 8788 --d1 DB_SCAE=scae_db --kv KV_SCAE --compatibility-date=2024-04-01"

  # 🌍 Cloudflare Tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: scae-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiNjdjOWRkM2ZiY2M5NmY3MDM1MjE3ODQwNzNiYTI0MjQiLCJ0IjoiN2I2NWVmOTEtMjJiMi00MDQxLTg1ODAtMDZmNTA5M2FiMTQ3IiwicyI6IlpUWTVOV1psTTJNdE0yUmtZaTAwT0dRNUxUazFNVE10WXpZd09EbG1PR0k0WTJWbSJ9
    depends_on:
      - web
      - api
