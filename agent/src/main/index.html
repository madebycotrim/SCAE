<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catraki Edge Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #121318;
            --s1: #1a1c23;
            --s2: #1f2129;
            --s3: #252830;
            --b1: rgba(255, 255, 255, 0.055);
            --b2: rgba(255, 255, 255, 0.09);
            --b3: rgba(255, 255, 255, 0.14);
            --t1: #d4d8e2;
            --t2: #8b91a0;
            --t3: #555c6e;
            --ok: #5a9e7c;
            --ok-dim: rgba(90, 158, 124, 0.12);
            --warn: #9e8c5a;
            --warn-dim: rgba(158, 140, 90, 0.12);
            --err: #9e5a5a;
            --err-dim: rgba(158, 90, 90, 0.12);
            --info-dim: rgba(90, 110, 158, 0.12);
            --info: #5a6e9e;
            --mono: 'IBM Plex Mono', monospace;
            --sans: 'IBM Plex Sans', sans-serif;
            --r: 6px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--t1);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-size: 13px;
        }

        /* ── TOASTS ─────────────────────────────────────── */
        #toast-area {
            position: fixed;
            bottom: 40px;
            right: 16px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }

        .toast {
            background: var(--s3);
            border: 1px solid var(--b2);
            border-radius: var(--r);
            padding: 8px 14px;
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--t2);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: toastIn 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .toast.ok {
            border-color: rgba(90, 158, 124, 0.3);
            color: var(--ok);
        }

        .toast.err {
            border-color: rgba(158, 90, 90, 0.3);
            color: var(--err);
        }

        /* ── HEADER ─────────────────────────────────────── */
        .header {
            height: 48px;
            background: var(--s1);
            border-bottom: 1px solid var(--b1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .h-brand {
            font-family: var(--mono);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--t2);
        }

        .h-sep {
            width: 1px;
            height: 16px;
            background: var(--b2);
        }

        .h-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--ok);
            animation: blink 2.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1 }
            55% { opacity: .35 }
        }

        .h-school {
            font-family: var(--mono);
            font-size: 0.6rem;
            color: var(--t3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            border: 1px solid var(--b1);
            border-radius: var(--r);
            background: transparent;
            color: var(--t3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .icon-btn:hover {
            border-color: var(--b2);
            color: var(--t2);
            background: var(--s2);
        }

        /* ── LAYOUT ─────────────────────────────────────── */
        .layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ── SIDEBAR ────────────────────────────────────── */
        .sidebar {
            width: 320px;
            background: var(--s1);
            border-right: 1px solid var(--b1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            overflow-y: auto;
        }

        .section-title {
            font-family: var(--mono);
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            color: var(--t3);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        /* ── MONITOR ────────────────────────────────────── */
        .live-monitor {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 10, 0.4);
            padding: 24px;
            overflow: hidden;
        }

        #log-container {
            flex: 1;
            overflow-y: auto;
            font-family: var(--mono);
            font-size: 0.7rem;
            line-height: 1.5;
            padding-top: 10px;
        }

        .log-entry { margin-bottom: 2px; }
        .log-ts { color: var(--t3); margin-right: 10px; }
        .log-lv { font-weight: 700; margin-right: 10px; }
        .lv-ok { color: var(--ok); }
        .lv-info { color: var(--info); }
        .lv-warn { color: var(--warn); }
        .lv-err { color: var(--err); }

        /* ── MODAL ──────────────────────────────────────── */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: var(--s1);
            border: 1px solid var(--b2);
            border-radius: 12px;
            padding: 24px;
            width: 440px;
            max-width: 90vw;
        }

        .modal-head { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .modal-title { font-family: var(--mono); font-size: 0.7rem; font-weight: 700; color: var(--t2); }
        
        .settings-item {
            background: var(--s2);
            border: 1px solid var(--b1);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .f-input {
            background: var(--s3);
            border: 1px solid var(--b2);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            width: 100%;
        }

        .btn-s {
            background: var(--s3);
            border: 1px solid var(--b2);
            color: var(--t1);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--mono);
            font-size: 0.7rem;
        }

        .btn-s.primary { background: var(--ok-dim); color: var(--ok); border-color: var(--ok); }

        .hidden { display: none; }
        .sb-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .sb-dot.ok { background: var(--ok); }
        .sb-dot.err { background: var(--err); }

        /* Status Bar */
        .statusbar {
            height: 28px;
            background: var(--s1);
            border-top: 1px solid var(--b1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-size: 0.65rem;
            color: var(--t3);
        }
    </style>
</head>

<body>
    <div id="toast-area"></div>

    <div class="header">
        <div class="header-left">
            <span class="h-brand">CATRAKI EDGE</span>
            <div class="h-sep"></div>
            <div class="h-status-dot"></div>
            <span class="h-school" id="school-badge">MODO LOCAL</span>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="btn-settings-open" title="Configurar IPs">
                ⚙️
            </button>
        </div>
    </div>

    <div class="layout">
        <div class="sidebar">
            <div class="section-title">Equipamentos Conectados</div>
            <div id="hardware-list">
                <div style="color: var(--t3); font-size: 0.7rem;">Buscando leitores...</div>
            </div>
        </div>

        <div class="live-monitor">
            <div class="section-title">Log de Eventos em Tempo Real</div>
            <div id="log-container"></div>
        </div>
    </div>

    <div class="statusbar">
        <div>Agent v1.6.0 · <span id="status-clock">--:--:--</span></div>
        <div id="uptime-val">uptime: 00:00:00</div>
    </div>

    <!-- MODAL DE CONFIGURAÇÕES -->
    <div id="settings-screen" class="modal-bg hidden">
        <div class="modal">
            <div class="modal-head">
                <span class="modal-title">GESTOR DE HARDWARE LOCAL</span>
                <button onclick="closeSettings()" style="background:none; border:none; color:var(--t3); cursor:pointer">✕</button>
            </div>
            
            <div id="settings-list" style="max-height: 300px; overflow-y: auto;"></div>
            
            <button onclick="addNewHardware()" class="btn-s" style="width:100%; margin-top: 10px; border-style: dashed;">
                + ADICIONAR NOVO IP
            </button>

            <div style="margin-top: 20px;">
                <button id="btn-save" onclick="saveHardware()" class="btn-s primary" style="width:100%">SALVAR E REINICIAR CONEXÕES</button>
            </div>
        </div>
    </div>

    <script>
        let configAtiva = [];
        let uptime = 0;

        // Clock
        setInterval(() => {
            document.getElementById('status-clock').textContent = new Date().toLocaleTimeString('pt-BR');
            uptime++;
            const h = String(Math.floor(uptime / 3600)).padStart(2, '0');
            const m = String(Math.floor((uptime % 3600) / 60)).padStart(2, '0');
            const s = String(uptime % 60).padStart(2, '0');
            document.getElementById('uptime-val').textContent = `uptime: ${h}:${m}:${s}`;
        }, 1000);

        function showToast(msg, type='info') {
            const area = document.getElementById('toast-area');
            const t = document.createElement('div');
            t.className = `toast ${type === 'ok' ? 'ok' : 'err'}`;
            t.textContent = msg;
            area.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function pushLog(msg, type='info') {
            const container = document.getElementById('log-container');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString('pt-BR');
            entry.innerHTML = `<span class="log-ts">${time}</span><span class="log-lv lv-${type}">${type.toUpperCase()}</span><span class="log-txt">${msg}</span>`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        // --- HARDWARE ---
        window.scaeApi.onHardwareStatus(status => {
            configAtiva = status.leitores || [];
            const list = document.getElementById('hardware-list');
            list.innerHTML = configAtiva.map(l => `
                <div style="padding:10px; background:rgba(255,255,255,0.03); border-radius:8px; margin-bottom:8px; border:1px solid rgba(255,255,255,0.05)">
                    <div style="display:flex; align-items:center; justify-content:space-between">
                        <div style="display:flex; align-items:center; gap:8px">
                            <span class="sb-dot ${l.online ? 'ok' : 'err'}"></span>
                            <span style="font-weight:700; font-size:0.8rem">${l.nome}</span>
                        </div>
                        <button onclick="verUsuarios('${l.id}', '${l.nome}')" style="background:var(--s3); border:none; color:var(--info); font-size:10px; padding:2px 6px; border-radius:4px; cursor:pointer">VER</button>
                    </div>
                    <div style="font-size:0.65rem; color:var(--t3); margin-top:4px">
                        ${l.ip}:${l.porta} · ${l.totalUsuarios || 0} USUÁRIOS
                    </div>
                </div>
            `).join('');
        });

        async function verUsuarios(leitorId, leitorNome) {
            pushLog(`Lendo banco de dados em tempo real de: ${leitorNome}...`, 'info');
            try {
                const users = await window.scaeApi.listarAlunos(leitorId);
                const listHtml = users.length > 0 
                  ? users.map(u => `<div style="padding:4px; font-family:var(--mono); font-size:11px; border-bottom:1px solid var(--b1)">[${u.id}] ${u.name}</div>`).join('')
                  : '<div style="color:var(--t3); padding:20px; text-align:center">Ninguém cadastrado neste leitor.</div>';
                
                // Abre o modal de listagem
                const modal = document.getElementById('settings-screen');
                const listArea = document.getElementById('settings-list');
                document.querySelector('.modal-title').textContent = `USUÁRIOS NO DISPOSITIVO: ${leitorNome}`;
                listArea.innerHTML = `<div style="max-height:400px; overflow-y:auto">${listHtml}</div>`;
                
                // Esconde botão de adicionar no modal de visualização
                document.querySelector('button[onclick="addNewHardware()"]').classList.add('hidden');
                document.getElementById('btn-save').classList.add('hidden');

                modal.classList.remove('hidden');
            } catch (e) {
                showToast('Erro ao ler hardware.', 'err');
            }
        }

        function closeSettings() {
            document.getElementById('settings-screen').classList.add('hidden');
            // Restaura botões para quando abrir configurações reais
            document.querySelector('button[onclick="addNewHardware()"]').classList.remove('hidden');
            document.getElementById('btn-save').classList.remove('hidden');
            document.querySelector('.modal-title').textContent = 'GESTOR DE HARDWARE LOCAL';
        }

        window.scaeApi.onNewLog(log => pushLog(log));
        window.scaeApi.onNewAccess(data => showToast(`ACESSO: ${data.nome}`, 'ok'));

        // --- SETTINGS ---
        document.getElementById('btn-settings-open').onclick = () => {
            renderSettings();
            document.getElementById('settings-screen').classList.remove('hidden');
        };

        function closeSettings() {
            document.getElementById('settings-screen').classList.add('hidden');
        }

        function renderSettings() {
            const list = document.getElementById('settings-list');
            list.innerHTML = configAtiva.map((l, i) => `
                <div class="settings-item">
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px; align-items: center;">
                        <input type="text" 
                            style="background:none; border:none; color:var(--t2); font-size:0.65rem; font-weight:700; width: 70%; outline: none;" 
                            value="${l.nome}" 
                            onchange="updateH(${i}, 'nome', this.value)"
                            placeholder="Nome do Leitor">
                        <button onclick="removeHardware(${i})" style="background:none; border:none; color:var(--err); cursor:pointer; font-size: 0.65rem;">excluir</button>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 80px; gap:8px">
                        <input type="text" class="f-input" value="${l.ip}" onchange="updateH(${i}, 'ip', this.value)" placeholder="IP">
                        <input type="number" class="f-input" value="${l.porta}" onchange="updateH(${i}, 'porta', this.value)" placeholder="Porta">
                    </div>
                </div>
            `).join('');
        }

        window.updateH = (i, k, v) => { configAtiva[i][k] = v; };
        window.removeHardware = (i) => { configAtiva.splice(i, 1); renderSettings(); };
        window.addNewHardware = () => {
            configAtiva.push({ nome: 'Novo Leitor', ip: '', porta: 14, tipo: 'ID_FLEX' });
            renderSettings();
        };

        async function saveHardware() {
            try {
                // Junta IP e Porta antes de salvar (ex: 192.168.1.34 + 80 -> 192.168.1.34:80)
                const hardwareFormatado = configAtiva.map(l => {
                    const ipBase = String(l.ip).split(':')[0];
                    const portaFinal = l.porta || 80;
                    return {
                        ...l,
                        ip: `${ipBase}:${portaFinal}`,
                        porta: parseInt(portaFinal)
                    };
                });

                await window.scaeApi.saveConfig({ configHardware: hardwareFormatado });
                showToast('Hardware sincronizado!', 'ok');
                closeSettings();
            } catch (e) {
                showToast('Erro ao salvar.', 'err');
            }
        }
    </script>
</body>
</html>
